html,body{margin:0;height:100%;background:#0b1626;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace}
#wrap{position:relative}
canvas{display:block;border-radius:6px;box-shadow:0 0 40px rgba(47,143,138,.25)}
#pad{display:none;box-sizing:border-box;justify-content:space-between;align-items:center;padding:12px 16px;gap:12px}
.coarse #pad{display:flex}
.coarse.land #pad{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;opacity:.55}
#dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
#dpad button:nth-child(1){grid-column:2;grid-row:1}
#dpad button:nth-child(2){grid-column:1;grid-row:2}
#dpad button:nth-child(3){grid-column:3;grid-row:2}
#dpad button:nth-child(4){grid-column:2;grid-row:3}
#acts{display:grid;grid-template-columns:auto auto;gap:10px 12px;align-items:center;justify-items:center}
button{font-family:inherit;border:0;color:#f4e7c9;background:#1f5f63;border-radius:12px;font-size:16px;touch-action:none}
#acts>button{width:78px;height:78px;border-radius:50%;font-size:10px;line-height:1.5}
#bFire{background:#d4453b}
#mini{display:flex;flex-direction:row;gap:6px;grid-row:2;grid-column:1/3}
#mini button{width:52px;height:34px;border-radius:10px;font-size:6px;line-height:1.4;background:#2a3550}
#bGift{background:#e3a832;color:#0f1e33}
button:active,button.on{filter:brightness(1.3)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="pad">
    <div id="dpad">
      <button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button>
    </div>
    <div id="acts">
      <div id="mini"><button id="bBomb" data-k="bomb">JINGLE<br>BOMB</button><button id="bHyper" data-k="hyper">HYPER<br>SPACE</button><button id="bMusic">MUSIC</button></div>
      <button id="bGift" data-k="drop">DROP<br>GIFT</button>
      <button id="bFire" data-k="fire">NOSE<br>LASER</button>
    </div>
  </div>
</div>
<script>
'use strict';
// ---------- constants & palette ----------
const W=960,H=540,WW=4800,TOP=62,GB=478;
let SLEIGH='#1f5f63';
const C={deep:'#0b1626',navy:'#0f1e33',sky2:'#1b3350',teal:'#2f8f8a',tealD:'#1f5f63',mustard:'#e3a832',red:'#d4453b',
  cream:'#f4e7c9',snowS:'#cfd8d6',brown:'#8a5a3b',brownL:'#a8754f',green:'#7cb342',greenD:'#4f7f2a',brick:'#9c3b30',ink:'#0a0f18'};
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const isCoarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
if(isCoarse)document.body.classList.add('coarse');
let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){
  const vw=innerWidth,vh=innerHeight,land=vw>vh;
  document.body.classList.toggle('land',land);
  let availH=vh-((isCoarse&&!land)?230:12);
  let w=Math.min(vw-12,availH*16/9); if(w<200)w=200;
  cv.style.width=w+'px';cv.style.height=(w*9/16)+'px';
  document.getElementById('pad').style.width=(isCoarse&&!land)?Math.min(vw,520)+'px':'';
  cv.width=W*dpr;cv.height=H*dpr;
}
addEventListener('resize',resize);resize();

// ---------- helpers ----------
const mod=(a,n)=>((a%n)+n)%n;
function wd(a,b){let d=mod(a-b,WW);if(d>WW/2)d-=WW;return d}
const TAU=Math.PI*2;
function groundY(x){return GB+16*Math.sin(x*TAU/WW*5)+8*Math.sin(x*TAU/WW*13+1)}
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}

  if(!s.alive){if(--s.respawn<=0){if(lives>0){Object.assign(s,{alive:true,inv:180,vx:0,vy:0,y:200})}else{endRun('over')}}return}
  if(k.left){s.face=-1;s.vx-=0.45}if(k.right){s.face=1;s.vx+=0.45}
  s.vx*=0.972;s.vx=Math.max(-10,Math.min(10,s.vx));
  if(k.up)s.vy=-5.2;else if(k.down)s.vy=5.2;else s.vy*=0.6;
  s.y+=s.vy;const gy=groundY(s.x)-34;if(s.y<TOP+26)s.y=TOP+26;if(s.y>gy)s.y=gy;
  s.x=mod(s.x+s.vx,WW);if(s.inv>0)s.inv--;
  if(s.fireCd>0)s.fireCd--;if(s.dropCd>0)s.dropCd--;
  if(k.fire&&s.fireCd<=0){s.fireCd=9;beams.push({x0:mod(s.x+s.face*58,WW),y:s.y-12,dir:s.face,len:0,life:22,stop:false});sfx.zap()}
  if(k.bomb&&!pb&&bombs>0){bombs--;jingleBomb()}pb=k.bomb;
  if(k.hyper&&!ph){hyperspace();ph=k.hyper;return}ph=k.hyper;
  if(k.drop&&s.dropCd<=0){s.dropCd=22;gifts.push({x:mod(s.x-s.face*30,WW),y:s.y-6,vx:s.vx*0.55,vy:0.5,rescued:false,col:[C.teal,C.mustard,C.red][Math.floor(Math.random()*3)]});sfx.drop()}
}

function chase(b,mx,acc){const dx=wd(ship.x,b.x),dy=ship.y-b.y,m=Math.hypot(dx,dy)||1;
  b.vx+=dx/m*acc+R(-0.15,0.15);b.vy+=dy/m*acc+R(-0.15,0.15);const v=Math.hypot(b.vx,b.vy);if(v>mx){b.vx*=mx/v;b.vy*=mx/v}}
function updBugs(demo){

  const litH=houses.filter(h=>h.lit&&!bugs.some(b=>b.target===h));

    if(b.kind==='bug'){
      if(b.state==='wander'){b.x=mod(b.x+b.vx*sp,WW);b.by+=Math.sin(b.t*0.3)*0.4;b.by=Math.max(TOP+40,Math.min(320,b.by));b.y=b.by+Math.sin(b.t)*18;
        if(!demo&&litH.length&&busy<L.busy&&Math.random()<L.seek){const h=litH[Math.floor(Math.random()*litH.length)];b.state='seek';b.target=h}}
      else if(b.state==='seek'){const h=b.target;const tx=h.chimX,ty=h.chimTop-16,dx=wd(tx,b.x);
        b.x=mod(b.x+Math.sign(dx)*Math.min(Math.abs(dx),1.8*sp),WW);b.y+=Math.sign(ty-b.y)*Math.min(Math.abs(ty-b.y),1.3*sp);
        if(Math.abs(dx)<4&&Math.abs(ty-b.y)<4){if(h.lit){h.lit=false;b.carry=true;b.state='carry';sfx.alarm();burst(h.chimX,h.chimTop,[C.mustard,C.cream],10,2);pop(h.x,h.chimTop-30,'BAH! HUMBUG!',C.green)}else{b.state='wander';b.by=b.y;b.target=null}}}
      else if(b.state==='carry'){b.y-=0.85*sp;b.x=mod(b.x+Math.sin(b.t*2)*0.8,WW);
        if(b.y<TOP+12){b.kind='mutant';b.state='chase';b.carry=false;b.target=null;b.vx=0;b.vy=0;sfx.alarm();pop(b.x,b.y+30,'SCROOGE BUG!',C.red)}}
    }
    else if(b.kind==='bomber'){b.x=mod(b.x+b.vx*sp,WW);b.y=b.by+Math.sin(b.t*0.6)*55;
      if(!demo&&--b.cool<=0){b.cool=R(60,120);mines.push({x:b.x,y:b.y+6,life:900,p:R(0,TAU)})}}
    else if(b.kind==='pod'){b.x=mod(b.x+b.vx,WW);b.y+=b.vy;if(b.y<TOP+40||b.y>330)b.vy*=-1}
    else if(demo){b.x=mod(b.x+(b.vx||1),WW)}
    else if(b.kind==='mutant'){chase(b,2.6+wave*0.25,0.13);b.x=mod(b.x+b.vx,WW);b.y=Math.max(TOP+14,Math.min(groundY(b.x)-20,b.y+b.vy))}
    else if(b.kind==='gnat'){const dx=wd(ship.x,b.x);b.vx+=Math.sign(dx)*0.22;b.vx=Math.max(-5.5,Math.min(5.5,b.vx));
      b.vy+=(ship.y-b.y)*0.003+R(-0.35,0.35);b.vy=Math.max(-2.6,Math.min(2.6,b.vy));b.x=mod(b.x+b.vx,WW);b.y=Math.max(TOP+14,Math.min(groundY(b.x)-16,b.y+b.vy))}
    else if(b.kind==='krampus'){chase(b,4.6+wave*0.3,0.22);b.x=mod(b.x+b.vx,WW);b.y=Math.max(TOP+14,Math.min(groundY(b.x)-20,b.y+b.vy))}
    if(demo)continue;
    const dxs=wd(ship.x,b.x);
    const shoots=b.kind==='mutant'||b.kind==='gnat'||b.kind==='krampus'||(b.kind==='bug'&&b.state!=='seek');
    if(shoots&&ship.alive&&Math.abs(dxs)<500){if(--b.cool<=0){
      b.cool=b.kind==='krampus'?R(45,85):b.kind==='gnat'?R(150,260):R(L.cool[0],L.cool[1]);
      const dy=ship.y-b.y,m=Math.hypot(dxs,dy)||1,v=L.cs;coal.push({x:b.x,y:b.y,vx:dxs/m*v+ship.vx*0.3,vy:dy/m*v,life:160})}}
    if(ship.alive&&ship.inv<=0&&Math.abs(dxs)<26&&Math.abs(ship.y-b.y)<22){killBug(b,i,true);killShip()}
  }
}
function updMines(){for(let j=mines.length-1;j>=0;j--){const m=mines[j];
  if(ship.alive&&ship.inv<=0&&Math.abs(wd(m.x,ship.x))<22&&Math.abs(m.y-ship.y+8)<20){mines.splice(j,1);killShip();break}
  if(--m.life<=0)mines.splice(j,1)}}
function updBeams(){
  for(let j=beams.length-1;j>=0;j--){const bm=beams[j];if(!bm.stop)bm.len=Math.min(bm.len+70,760);
    if(!bm.stop)for(let i=bugs.length-1;i>=0;i--){const b=bugs[i],d=wd(b.x,bm.x0)*bm.dir;
      if(d>-12&&d<bm.len&&Math.abs(b.y-bm.y)<17){bm.len=Math.max(d,0);bm.stop=true;killBug(b,i);break}}
    if(!bm.stop)for(let i=mines.length-1;i>=0;i--){const m=mines[i],d=wd(m.x,bm.x0)*bm.dir;
      if(d>-10&&d<bm.len&&Math.abs(m.y-bm.y)<14){bm.len=Math.max(d,0);bm.stop=true;mines.splice(i,1);addScore(20);burst(m.x,m.y,[C.red,C.green,C.cream],12,2.5);sfx.thunk();pop(m.x,m.y-14,'20');break}}
    if(--bm.life<=0)beams.splice(j,1)}
}
function updGifts(){

    for(const h of houses){const dx=wd(g.x,h.chimX);

        if(!h.lit){h.lit=true;const pts=g.rescued?750:500;addScore(pts);sfx.bell();pop(h.x,h.chimTop-24,g.rescued?'CHIMNEY RESCUE! 750':'DOWN THE CHIMNEY! 500',C.mustard);burst(h.chimX,h.chimTop,[C.mustard,C.red,C.cream,C.teal],24,3.5)}
        else{addScore(50);sfx.thunk();pop(h.x,h.chimTop-24,'+50')}

        break}}
    if(!gone&&g.y>groundY(g.x)){gone=true;sfx.thunk();burst(g.x,g.y,[C.cream,C.snowS,g.col],12,2.4)}

}
function updCoal(){
  for(let j=coal.length-1;j>=0;j--){const c=coal[j];c.x=mod(c.x+c.vx,WW);c.y+=c.vy;c.life--;
    if(ship.alive&&ship.inv<=0&&Math.abs(wd(c.x,ship.x))<22&&Math.abs(c.y-ship.y+8)<16){coal.splice(j,1);killShip();break}
    if(c.life<=0||c.y<TOP||c.y>groundY(c.x))coal.splice(j,1)}
}
function updFx(){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x=mod(p.x+p.vx,WW);p.y+=p.vy;p.vy+=0.08;p.vx*=0.98;if(--p.life<=0)parts.splice(i,1)}

function updCam(demo){

  if(demo){camX=mod(camX+1.2,WW)}else{const tgt=ship.face*230+ship.vx*6;lead+=(tgt-lead)*0.045;camX=mod(ship.x+lead,WW)}

function step(){
  frame++;const sp=startPress;startPress=false;
  if(state==='wave'){updCam(false);updFx();if(--cardT<=0)state='play';return}
  if(state==='play'){
    if(paused)return;
    updShip();updCam(false);updBugs(false);updBeams();updGifts();updCoal();updMines();updFx();if(flash>0)flash--;
    if(state!=='play')return;
    const L=lvl();waveT++;
    if(L.kr&&waveT>=L.kr&&(waveT-L.kr)%900===0&&bugs.filter(b=>b.kind==='krampus').length<2){const kb=mk('krampus',mod(ship.x+(Math.random()<.5?-1:1)*650,WW),R(TOP+40,200));bugs.push(kb);sfx.alarm();pop(ship.x,ship.y-50,'KRAMPUS IS COMING!',C.red)}
    if(!bugs.some(b=>b.kind!=='krampus')){bugs=[];coal=[];const l=lit(),bonus=l*100;if(bonus)addScore(bonus);
      if(wave<=LAST)startChase(wave,wave===LAST?'win':'wave');else{wave++;spawnWave();waveCard();sfx.jingle()}}
    return}
  updCam(true);updBugs(true);updFx();                    // every other screen runs the attract world underneath
  if(state==='front'){cardT++;if(sp||cardT>720)goTo('title');return}
  if(state==='title'){idleT++;if(sp){startGame(1);return}if(idleT>(demoHash?300:1500)){attract=true;startChase(1,'reel')}return}
  if(state==='chase'){chaseT+=1/60;if(sp&&(attract||chaseT>0.4)){if(attract){attract=false;goTo('title')}else endChase();return}if(chaseT>=CH_LEN[chaseN])endChase();return}
  if(state==='board'){boardT++;if((sp&&boardT>20)||(attract&&boardT>480)){if(sp)attract=false;leaveBoard()}return}
  if(state==='win'){cardT++;if(sp&&cardT>60){wave++;spawnWave();waveCard();sfx.jingle()}return}
  if(state==='over'){overT++;if(overT>70&&sp)startGame(wave);return}
}

    for(let k=0;k<n;k++)actor(()=>kid(fam[k],ph+k*1.3,false),tx-k*58,false,sc(k));
    if(n===1){strand(tx+112,150+bobY(0)+12,tx+112,150+bobY(0)+28);hb('bug',tx+112,150+bobY(0),-1,true)}
    else{const x1=tx+100,x2=tx+168,y1=140+bobY(0),y2=140+bobY(1),gx=(x1+x2)/2,gy=212+(bobY(0)+bobY(1))/2;
      strand(x1,y1+12,gx-14,gy-18);strand(x2,y2+12,gx+14,gy-18);gift(gx,gy,C.red,2.6);hb('bug',x1,y1,-1);hb('bug',x2,y2,-1)}}
  else if(n<=4){const v=108,run=n===3?t:Math.min(t,3.2),tx=-60+v*run,treeX0=tx+165;
    let treeX=treeX0,treeY=GY-6,sway=Math.sin(t*3)*.05,drop=0;
    const bx=[tx+112,tx+165,tx+218],by=[106,94,106].map((y,k)=>y+bobY(k));
    if(n===4&&t>3.2){const u=t-3.2;drop=Math.min(1,u/.55);treeY=GY-6-54*(1-drop*drop);sway=drop<1?Math.sin(u*14)*.12*(1-drop):0;for(let k=0;k<3;k++){by[k]-=u*u*120+u*40;bx[k]+=(k-1)*u*90}}
    else treeY=GY-54;
    if(!(n===4&&t>3.2&&drop>=1)||true){if(!(n===4&&t>3.2)){for(let k=0;k<3;k++)strand(bx[k],by[k]+12,treeX+(k-1)*16,treeY-62+Math.abs(k-1)*20)}}
    xtree(treeX,treeY,.92,sway);
    for(let k=0;k<3;k++)hb(n===4&&t>3.2?'mutant':'bug',bx[k],by[k],-1);
    const slow=n===4?clamp((t-3.2)/1,0,1):0,fx=n===4&&t>3.2?tx+108*(slow-slow*slow/2):tx;
    for(let k=0;k<3;k++)actor(()=>kid(fam[k],slow>=1?ph*.3+k:ph+k*1.3,false,slow>=1),fx-k*58,false,sc(k));
    if(n===4){let rx,ry=0;const tgt=treeX0-34;
      if(t<3.2)rx=Math.min(-220+250*t,tgt);else{rx=tgt;const u=t-3.2;ry=u<.6?-Math.sin(u/.6*Math.PI)*46:0}
      actor(()=>{hx.save();hx.translate(0,ry);riley(t<3.8?ph:ph*.5,t>3.8,t>4.4);hx.restore()},rx);
      if(t>3.25&&t<4.2)text('WOOF!',rx+30,GY-96,14,P.red,'center',BUN,1);
      if(slow>=1)for(let k=0;k<3;k++)heart(fx-k*58+4,GY-86-Math.sin(t*6+k)*2,5)}}
  if(n===5){
    const tx=Math.min(-120+92*t,252),walk=tx<252,treeX=420;
    xtree(treeX,GY,1.05,0);
    const sx3=t<3.6?720-280*(1-Math.pow(1-clamp((t-1.8)/1.8,0,1),3)):t<5?440-60*((t-3.6)/1.4):380+180*(e5=>e5*e5*(3-2*e5))(clamp((t-5)/1.4,0,1)),
      sy3=t<3.6?40+56*clamp((t-1.8)/1.8,0,1)+Math.sin(t*3)*3:t<5?96+Math.sin(t*3)*3:96+(GY-28-96)*(e5=>e5*e5*(3-2*e5))(clamp((t-5)/1.4,0,1));
    const sleighX=t5=>t5<5?440-60*((t5-3.6)/1.4):0;
    [[3.75,treeX+28,GY-11,C.teal,1.7],[4.05,treeX+2,GY-8,C.mustard,1.2],[4.35,treeX-30,GY-9,C.red,1.4],[4.65,treeX-50,GY-7,C.teal,1.1]].forEach(([td,gx,gy,col,gs])=>{
      if(t<td)return;const u=clamp((t-td)/.55,0,1),x0=sleighX(td)+8,y0=104;
      const bounce=u>=1?Math.max(0,Math.sin((t-td-.55)*12)*5*Math.exp(-(t-td-.55)*6)):0;
      gift(x0+(gx-x0)*u,y0+(gy-y0)*u*u-bounce,col,gs)});
    for(let k=0;k<3;k++)actor(()=>kid(fam[k],walk?ph+k*1.3:t+k,false,!walk),tx-k*58,false,sc(k));
    actor(()=>riley(walk?ph:t*2,!walk,!walk),Math.min(-60+92*t,322));
    if(t>1.8)sleighAt(sx3,sy3,-1,.78);                                              // here comes Santa
    if(t>6.4&&!rang){rang=true;sfx.bell()}
    if(t>6.6){const a=clamp((t-6.6)/.8,0,1);hx.globalAlpha=a;text('Merry Christmas!',HW/2,112,44,P.cream,'center',LOB,3);
      for(let k=0;k<3;k++)heart(252-k*58+4,GY-90-Math.sin(t*5+k)*3,5);hx.globalAlpha=1}}
  hx.restore();
  text(CH_CAP[n],HW/2,34,13,P.must,'center');
  if(!attract&&chaseThen!=='reel'&&t>1.2)text((isCoarse?'TAP':'SPACE OR TAP')+' TO SKIP',HW/2,318,8,'#5f7d7a','center');
  if(chaseThen==='reel'&&!attract)text('SCENE '+n+' OF 5',HW/2,318,8,'#5f7d7a','center');
  if(n===5)hbug()}

// ---------- the screens ----------
const SHOW=[118,236,196,22],NICE=[326,236,196,22];
function btn(r,label,on){hx.fillStyle=P.char;hx.fillRect(r[0],r[1],r[2],r[3]);hx.strokeStyle=P.must;hx.lineWidth=1.5;hx.strokeRect(r[0]+.5,r[1]+.5,r[2]-1,r[3]-1);
  hx.fillStyle=P.must;hx.beginPath();hx.moveTo(r[0]+10,r[1]+6);hx.lineTo(r[0]+18,r[1]+11);hx.lineTo(r[0]+10,r[1]+16);hx.fill();text(label,r[0]+r[2]/2+6,r[1]+11.5,8,on?P.must:P.cream,'center')}

    text('FROM',HW/2,204,10,P.tealLt,'center');text(cardFrom,HW/2,230,fit(cardFrom,460,30,LOB),P.orange,'center',LOB,2)}
  else{text('FROM',HW/2,144,10,P.tealLt,'center');text(cardFrom,HW/2,180,fit(cardFrom,500,40,LOB),P.orange,'center',LOB,2)}
  if(blink)text((isCoarse?'TAP':'TAP OR PRESS A KEY')+' TO OPEN YOUR CARD',HW/2,290,13,P.cream,'center');hbug()}

    text('A REMAKE OF DARCI’S 1998 CHRISTMAS CARD GAME',HW/2,158,8,P.must,'center');
    text('BROUGHT TO YOU BY',HW/2,186,9,P.tealLt,'center');text('Forrester Funtainment',HW/2,208,27,P.orange,'center',LOB,2)}
  else{text('MEET THE HUMBUG HORDE',HW/2,136,10,P.cream,'center');
    const ro=[['bug','HUMBUG','150'],['mutant','SCROOGE BUG','150'],['bomber','FRUITCAKE BOMBER','250'],['pod','BAH-NAMENT','1000'],['gnat','GNATCRACKER','150'],['krampus','KRAMPUS SAUCER','200']];
    ro.forEach((r,i)=>{const cx=HW/2-200+(i%3)*200,cy=168+Math.floor(i/3)*40;hb(r[0],cx-58,cy,1,false,1);text(r[1],cx-34,cy-4,8,P.cream);text(r[2]+' PTS',cx-34,cy+8,7,P.must)})}
  SHOW[0]=board?118:(HW-SHOW[2])/2;btn(SHOW,'WATCH THE CUT SCENES'+(isCoarse?'':' (V)'));if(board)btn(NICE,'THE NICE LIST'+(isCoarse?'':' (L)'));
  text(isCoarse?'D-PAD FLY  •  NOSE LASER  •  DROP GIFT  •  JINGLE BOMB  •  HYPERSPACE':'ARROWS/WASD FLY  •  SPACE NOSE LASER  •  X DROP GIFT  •  C JINGLE BOMB  •  H HYPERSPACE',HW/2,276,7,P.tealLt,'center');
  if(blink)text((isCoarse?'TAP':'PRESS SPACE OR TAP')+' TO PLAY',HW/2,302,15,P.cream,'center');
  const hiS=Math.max(hi,board&&board[0]?board[0].score:0);
  text((hiS?'HI '+pad6(hiS)+'   ':'')+(isCoarse?'':'M MUSIC '+(musicOn?'ON':'OFF')+'   T TEST MODE'+(testMode?' ON':'')),HW/2,330,7,testMode?P.red:'#5f7d7a','center');hbug()}
function drawWaveH(){const a=clamp(Math.min(cardT/20,(170-cardT)/15),0,1);hx.globalAlpha=a;
  hx.fillStyle='rgba(20,28,32,.86)';hx.fillRect(HW/2-210,122,420,112);hx.strokeStyle=P.must;hx.lineWidth=2;hx.strokeRect(HW/2-209,123,418,110);
  sputnik(HW/2-180,150,12,P.must);sputnik(HW/2+180,150,12,P.must);
  text(cardText[0],HW/2,158,28,P.must,'center',BUN,2);text(cardText[1]||'',HW/2,192,11,P.cream,'center');text('GET READY',HW/2,216,8,P.tealLt,'center');hx.globalAlpha=1}
function drawWinH(blink){panel();text('Merry Christmas!',HW/2,74,46,P.cream,'center',LOB,3);
  text('CHRISTMAS IS SAVED',HW/2,124,22,P.must,'center',BUN,2);text('SCORE '+pad6(score)+'  •  '+lit()+' OF 12 HOMES LIT',HW/2,156,12,P.cream,'center');
  text(SIGN,HW/2,192,10,P.tealLt,'center');text(cardFrom,HW/2,218,fit(cardFrom,460,30,LOB),P.orange,'center',LOB,2);
  if(blink&&cardT>60)text('STILL GOT GIFTS?  '+(isCoarse?'TAP':'PRESS SPACE')+' FOR BOXING DAY',HW/2,290,12,P.cream,'center');hbug()}
function drawOverH(blink){panel();text('GAME OVER',HW/2,58,36,P.must,'center',BUN,3);
  text('SCORE '+pad6(score)+'  •  '+lvName(wave),HW/2,92,12,P.tealLt,'center');wishes(146,42,30);
  if(blink&&overT>70)text((isCoarse?'TAP':'PRESS SPACE OR TAP')+' TO TRY THIS LEVEL AGAIN',HW/2,290,13,P.cream,'center');
  if(overT>70)text(isCoarse?'':'ESC FOR THE TITLE',HW/2,312,7,'#5f7d7a','center');hbug()}
const INI_X=[260,320,380],OKB=[272,262,96,26];
function tri(x,y,up,col){hx.fillStyle=col;hx.beginPath();hx.moveTo(x-9,y+(up?6:-6));hx.lineTo(x+9,y+(up?6:-6));hx.lineTo(x,y+(up?-7:7));hx.fill()}

  text('SCORE '+pad6(score)+'  •  '+lvName(wave),HW/2,84,12,P.cream,'center');text('SIGN YOUR NAME',HW/2,110,10,P.tealLt,'center');
  for(let i=0;i<3;i++){const x=INI_X[i],on=ini.k===i;hx.fillStyle=on?'#24343a':P.char;hx.fillRect(x-24,163,48,54);
    hx.strokeStyle=on?P.must:'#3c5257';hx.lineWidth=on?2:1;hx.strokeRect(x-24+.5,163.5,47,53);text(ABC[ini.L[i]],x,192,34,on&&blink?P.must:P.cream,'center',BUN,2);
    tri(x,149,true,on?P.must:'#5f7d7a');tri(x,233,false,on?P.must:'#5f7d7a')}
  const okOn=ini.k===3;hx.fillStyle=okOn?P.must:P.char;hx.fillRect(OKB[0],OKB[1],OKB[2],OKB[3]);hx.strokeStyle=P.must;hx.lineWidth=1.5;hx.strokeRect(OKB[0]+.5,OKB[1]+.5,OKB[2]-1,OKB[3]-1);
  text(ini.sending?'...':'OK',HW/2,OKB[1]+13.5,14,okOn?P.char:P.cream,'center',BUN,okOn?.01:1);
  text(isCoarse?'D-PAD PICKS YOUR LETTERS, NOSE LASER WHEN DONE':'TYPE YOUR INITIALS OR USE THE ARROWS  •  ENTER WHEN DONE',HW/2,310,9,P.tealLt,'center')}
function drawBoardH(blink){panel(.9);text('THE NICE LIST',HW/2,50,26,P.must,'center',BUN,2);text('TOP TEN HUMBUG HUNTERS',HW/2,76,9,P.tealLt,'center');
  if(!board||!board.length)text('NO NAMES YET - BE THE FIRST!',HW/2,180,14,P.cream,'center');
  else board.forEach((e,i)=>{const y=100+i*19,me=i===myRank,col=me?(blink?P.must:P.orange):i===0?P.must:P.cream;
    text((i+1)+'.',222,y,13,col,'right');text(e.ini,236,y,13,col);text(pad6(e.score),400,y,13,col,'right');text(lvName(e.level),414,y,9,me?col:'#5f7d7a')});
  if(blink&&!attract)text((isCoarse?'TAP':'PRESS SPACE OR TAP')+' TO CONTINUE',HW/2,302,11,P.cream,'center');hbug()}
function drawLayer(){hx.clearRect(0,0,HW,HH);const blink=Math.floor(frame/30)%2===0;
  switch(state){case'front':drawFront(blink);break;case'title':drawTitleH(blink);break;case'wave':drawWaveH();break;case'chase':drawChase(chaseN,chaseT);break;
    case'win':drawWinH(blink);break;case'over':drawOverH(blink);break;case'initials':drawInitials(blink);break;case'board':drawBoardH(blink);break;default:return false}
  ctx.drawImage(hc,0,0,W,H);return true}
function canvasHit(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*HW,y=(e.clientY-r.top)/r.height*HH,inR=b=>x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3];
  if(['front','title','win','over','board'].includes(state)&&!attract&&inR(HOMEB)){location.href='../';return true}
  if(state==='title'){if(inR(SHOW)){attract=false;startChase(1,'reel');return true}if(board&&inR(NICE)){showBoard('title');return true}}
  if(state==='initials'){for(let i=0;i<3;i++){if(Math.abs(x-INI_X[i])<26){if(y>135&&y<160){ini.k=i;iniLetter(1);return true}if(y>222&&y<246){ini.k=i;iniLetter(-1);return true}if(y>160&&y<220){ini.k=i;return true}}}
    if(inR(OKB)){submitIni();return true}return true}
  return false}


// ---------- loop ----------
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(loop)}
for(let i=0;i<9;i++){const b=mk(['bug','bug','bomber','pod'][i%4],R(0,WW),R(120,300));b.vx=R(0.6,1.4)*(Math.random()<.5?-1:1);b.vy=0.25;bugs.push(b)}
houses.forEach((h,i)=>h.lit=i%2===0);
const demoHash=location.hash==='#demo';
if(demoHash){state='title';attract=true;startChase(1,'reel')}else if(location.hash==='#chases')startChase(1,'reel');
requestAnimationFrame(loop);
