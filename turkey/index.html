  html, body { margin: 0; height: 100%; background: #12181a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); aspect-ratio: 16 / 9; width: min(100vw, 177.78vh); }
  canvas { width: 100%; height: 100%; display: block; }
  #pad { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #stage { top: 5vh; transform: translateX(-50%); }
    #pad { position: absolute; left: 0; right: 0; top: calc(5vh + 56.25vw); bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; }
    #keys { display: grid; grid-template-columns: repeat(3, min(16vw, 9vh, 64px)); grid-template-rows: repeat(3, min(16vw, 9vh, 64px)); gap: 4px; }
    #keys button { -webkit-appearance: none; appearance: none; margin: 0; padding: 0; background: #1f2a30; border: 2px solid #e0a526; border-radius: 12px; box-shadow: 0 4px 0 #0b1012; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    #keys button:active { background: #2f8f8a; transform: translateY(3px); box-shadow: 0 2px 0 #0b1012; }
    #keys svg { width: 46%; height: 46%; fill: #f3e9d2; pointer-events: none; }
    #kU { grid-area: 1 / 2; } #kL { grid-area: 2 / 1; } #kR { grid-area: 2 / 3; } #kD { grid-area: 3 / 2; }
    #watch { -webkit-appearance: none; appearance: none; margin: 0; padding: 12px 18px; background: #1f2a30; color: #f3e9d2; border: 2px solid #e0a526; border-radius: 12px; box-shadow: 0 4px 0 #0b1012; font: 14px "Bungee", "Arial Black", sans-serif; letter-spacing: .06em; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #watch:active { background: #2f8f8a; transform: translateY(3px); box-shadow: 0 2px 0 #0b1012; }
    #tip { color: #7cc4bc; font: 12px "Bungee", "Arial Black", sans-serif; letter-spacing: .08em; text-align: center; line-height: 1.7; }
  }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #f3e8be; font: 18px Futura, "Century Gothic", "Trebuchet MS", sans-serif; text-align: center; padding: 2em; }

<body>
<div id="stage"><canvas id="c"></canvas><div id="err">This needs WebGL2, and this browser didn't hand one over.</div></div>
<div id="pad"><div id="keys">
  <button id="kU" aria-label="Hop up"><svg viewBox="0 0 10 10"><polygon points="5,1 9.5,9 .5,9"/></svg></button>
  <button id="kL" aria-label="Hop left"><svg viewBox="0 0 10 10"><polygon points="1,5 9,.5 9,9.5"/></svg></button>
  <button id="kR" aria-label="Hop right"><svg viewBox="0 0 10 10"><polygon points="9,5 1,.5 1,9.5"/></svg></button>
  <button id="kD" aria-label="Hop down"><svg viewBox="0 0 10 10"><polygon points="5,9 9.5,1 .5,1"/></svg></button>
</div><button id="watch">&#9654;&nbsp; WATCH THE CHASE SCENES</button><div id="tip">SWIPING WORKS TOO<br>TURN SIDEWAYS FOR A BIGGER PICTURE</div></div>
<script>
"use strict";
// The Great Turkey Escape (a Forrester Funtainment game). One file, no assets: every model is built from three superquadric meshes.
const W = 640, H = 360, SC = 3;                  // low-res scene, upscaled x3 with scan lines
const COLS = 9, WRAP = 13;                       // playfield runs to the screen edge (x in [-9, 9]); traffic wraps at +-13
const TILT = 32 * Math.PI / 180, VW = 20.6, VH = VW * H / W, CAMZ = -0.28;
const LIGHT = norm([-0.55, 0.86, -0.30]);        // light from the left
const SLOTX = [-6, -3, 0, 3, 6];
const HOP = 0.12;

function norm(v) { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rowZ = r => r - 5;
const isRoad = r => r >= 1 && r <= 4, isRiver = r => r >= 6 && r <= 9;

// ---------- matrices (column-major) ----------
