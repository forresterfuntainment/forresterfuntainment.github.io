  html, body { margin: 0; height: 100%; background: #0d1214; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: linear-gradient(#0d1214 0%, #122126 55%, #1b3338 100%); }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(rgba(0,0,0,.24) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
  .lob { font-family: "Lobster", "Brush Script MT", cursive; }
  .bun { font-family: "Bungee", "Arial Black", Impact, sans-serif; }
  .poke { cursor: pointer; outline: none; }
  .poke:focus-visible { outline: 2px dashed #f3e9d2; outline-offset: 2px; }
  .star { transform-box: fill-box; transform-origin: center; animation: tw 3.4s ease-in-out infinite; }
  .star.pop { animation: pop .55s ease-out; }
  @keyframes tw { 0%, 100% { opacity: .35; transform: scale(.82) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(8deg); } }
  @keyframes pop { 0% { transform: scale(1); opacity: 1; } 35% { transform: scale(2.1) rotate(45deg); opacity: 1; } 100% { transform: scale(1) rotate(90deg); opacity: .7; } }
  #top { transform-box: fill-box; transform-origin: center; transition: transform 1.6s cubic-bezier(.15, .7, .2, 1); }
  #halo { animation: halo 2.8s ease-in-out infinite; }
  @keyframes halo { 0%, 100% { opacity: .16; } 50% { opacity: .34; } }
  .bulb { animation: chase 1.6s linear infinite; }
  .fast .bulb { animation-duration: .45s; }
  @keyframes chase { 0%, 18% { fill: #fff3c4; } 30%, 100% { fill: #7a5a14; } }
  .tile { transform-box: fill-box; transform-origin: center; }
  .tile.buzz { animation: buzz .9s steps(1) 1; }
  @keyframes buzz { 0% { opacity: .15; } 8% { opacity: 1; } 16% { opacity: .1; } 30% { opacity: 1; } 38% { opacity: .2; } 52% { opacity: 1; transform: rotate(-9deg) scale(1.12); } 76% { transform: rotate(7deg) scale(1.06); } 100% { opacity: 1; transform: none; } }
  #now .hl { animation: hl 1.3s ease-in-out infinite; }
  @keyframes hl { 0%, 100% { opacity: .0; } 50% { opacity: .55; } }
  #now:hover .hl, #now:focus .hl { animation: none; opacity: .8; }
  #now { outline: none; }
  #play { animation: nud 1.3s ease-in-out infinite; }
  @keyframes nud { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
  #ufo { opacity: 0; }
  #ufo.fly { animation: fly 5.2s linear 1; }
  @keyframes fly { 0% { opacity: 1; transform: translate(-60px, 70px); } 25% { transform: translate(90px, 36px); } 50% { transform: translate(190px, 62px); } 75% { transform: translate(300px, 30px); } 99% { opacity: 1; transform: translate(430px, 54px); } 100% { opacity: 0; transform: translate(430px, 54px); } }
  #beam { animation: beam .5s steps(2) infinite; }
  @keyframes beam { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .star, .bulb, #halo, #now .hl, #play, #beam { animation: none; } #top { transition: none; } }
</style>

<div id="scan"></div>
<script>
"use strict";
const NS = 'http://www.w3.org/2000/svg', $ = id => document.getElementById(id);
const el = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; };
const P = { cream: '#f3e9d2', must: '#e0a526', teal: '#2f8f8a', tealLt: '#7cc4bc', orange: '#d9622b', red: '#c8382c', char: '#1f2a30' };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// the house starburst: eight points, ball tips
function sputnik(parent, x, y, R, col) {
  const g = el('g', {}, parent);
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? R * .62 : R, px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    el('line', { x1: x, y1: y, x2: px, y2: py, stroke: col, 'stroke-width': Math.max(.8, R * .07), 'stroke-linecap': 'round' }, g);
    el('circle', { cx: px, cy: py, r: R * (i % 2 ? .07 : .1), fill: col }, g); }
  el('circle', { cx: x, cy: y, r: R * .12, fill: col }, g); return g;
}

// ---------- sound: tiny blips, only after a poke ----------
let ac = null;
function wake() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); }
for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, wake, true);
function beep(f, d, type, v, slide) {
  if (!ac) return;
  try { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(v || .04, t); g.gain.linearRampToValueAtTime(0, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02); } catch (e) {}
}
const poke = (node, fn) => { node.addEventListener('click', e => { wake(); fn(e); }); node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); } }); };

// ---------- sky: starbursts you can poke; every fourth one calls the saucer ----------
const sky = $('stars'), cols = [P.must, P.tealLt, P.orange, P.cream, P.teal]; let pokes = 0;
const clear = (x, y) => !(x > 20 && x < 350 && y > 86 && y < 530) && !(Math.hypot(x - 99, y - 46) < 60);
for (let i = 0, n = 0; n < 52 && i < 900; i++) {                 // the first batch sits over the sign, for tall phones; the rest spread wide for desktops
  const near = n < 20, x = near ? 6 + rnd() * 348 : -330 + rnd() * 1020, y = near ? -250 + rnd() * 334 : -120 + rnd() * 670; if (!clear(x, y)) continue; n++;
  const R = 4 + rnd() * 9, g = el('g', { class: 'poke' }, sky), s = sputnik(g, x, y, R, cols[n % cols.length]);
  s.setAttribute('class', 'star'); s.style.animationDelay = (-rnd() * 3.4) + 's'; s.style.animationDuration = (2.6 + rnd() * 2.4) + 's';
  el('circle', { cx: x, cy: y, r: Math.max(16, R + 6), fill: 'transparent' }, g);
  poke(g, () => { s.classList.remove('pop'); void s.getBoundingClientRect(); s.classList.add('pop'); beep(700 + rnd() * 700, .12, 'triangle', .05, 500);
    if (++pokes % 4 === 0) saucer(); });
  s.addEventListener('animationend', e => { if (e.animationName === 'pop') s.classList.remove('pop'); });
}
for (let i = 0; i < 150; i++) { const x = -390 + rnd() * 1140, y = -300 + rnd() * 860; el('rect', { x, y, width: 1.3, height: 1.3, fill: P.cream, opacity: .15 + rnd() * .5 }, sky); }
const ufo = $('ufo');
function saucer() { if (ufo.classList.contains('fly')) return; ufo.classList.add('fly'); beep(300, 1.1, 'sine', .05, 900); setTimeout(() => beep(1200, 1.2, 'sine', .04, -800), 1200); }
ufo.addEventListener('animationend', () => ufo.classList.remove('fly'));
poke(ufo, () => { beep(1500, .3, 'sawtooth', .04, -1200); });

// ---------- the big starburst: poke it and it spins, and the board lights race ----------
sputnik($('topart'), 99, 46, 36, P.must); let turn = 0, calm = 0;
poke($('top'), () => { turn += 405; $('top').style.transform = `rotate(${turn}deg)`; $('s').classList.add('fast'); clearTimeout(calm); calm = setTimeout(() => $('s').classList.remove('fast'), 2600);
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .12, 'square', .04), i * 90)); });

// ---------- ARCADE tiles: each one buzzes like tired neon ----------
const tc = [P.orange, P.must, P.tealLt, P.red, P.must, P.orange], tf = ['#f3e9d2', '#1f2a30', '#1f2a30', '#f3e9d2', '#1f2a30', '#f3e9d2'];
'ARCADE'.split('').forEach((ch, i) => {
  const x = 58 + i * 46, y = 248 + (i % 2 ? 5 : 0), rot = (i % 2 ? 6 : -6), g = el('g', { class: 'poke', tabindex: 0, role: 'button', 'aria-label': 'Sign letter ' + ch }, $('tiles')), t = el('g', { class: 'tile' }, g);
  const r = el('g', { transform: `rotate(${rot} ${x + 20} ${y + 20})` }, t);
  el('rect', { x: x + 4, y: y + 5, width: 40, height: 40, fill: '#0b1012' }, r); el('rect', { x, y, width: 40, height: 40, fill: tc[i], stroke: P.cream, 'stroke-width': 2 }, r);
  el('rect', { x: x + 1, y: y + 1, width: 4, height: 38, fill: '#ffffff', opacity: .28 }, r);
  const tx = el('text', { x: x + 20, y: y + 30, 'text-anchor': 'middle', class: 'bun', 'font-size': 27, fill: tf[i] }, r); tx.textContent = ch;
  poke(g, () => { t.classList.remove('buzz'); void t.getBoundingClientRect(); t.classList.add('buzz'); beep(90 + i * 12, .5, 'sawtooth', .035, 30); setTimeout(() => beep(392 + i * 60, .14, 'square', .04), 480); });
  t.addEventListener('animationend', () => t.classList.remove('buzz'));
});

// ---------- the letter board: changeable letters, each a little crooked ----------
for (let y = 357; y < 505; y += 15) el('line', { x1: 55, y1: y, x2: 325, y2: y }, $('rails'));
function letters(parent, s, cx, y, size, col, step) {
  const w = (s.length - 1) * step; s.split('').forEach((ch, i) => { if (ch === ' ') return; const x = cx - w / 2 + i * step, a = (rnd() - .5) * 7, dy = (rnd() - .5) * 1.6;
    const t = el('text', { x, y: y + dy, 'text-anchor': 'middle', class: 'bun', 'font-size': size, fill: col, transform: `rotate(${a.toFixed(1)} ${x} ${y - size * .35})` }, parent); t.textContent = ch; });
}
letters($('row1'), 'THE GREAT', 190, 379, 17, P.char, 15.5);
letters($('row2'), 'TURKEY ESCAPE', 157, 411, 16, P.char, 14.2);
letters($('row3'), 'HUMBUGS', 190, 473, 22, '#3d525b', 21);
$('now').addEventListener('click', () => beep(880, .1, 'square', .05, 440));

// chasing bulbs round the frame
const pts = []; for (let x = 50; x <= 330; x += 20) pts.push([x, 324]); for (let y = 344; y <= 496; y += 19) pts.push([330, y]);
for (let x = 330; x >= 50; x -= 20) pts.push([x, 510]); for (let y = 491; y >= 343; y -= 19) pts.push([50, y]);
pts.forEach((p, i) => { const c = el('circle', { cx: p[0], cy: p[1], r: 2.6, class: 'bulb' }, $('bulbs')); c.style.animationDelay = (-1.6 + (i % 8) * .2) + 's'; });
for (let x = -390; x < 760; x += 46) el('rect', { x, y: 617, width: 24, height: 3 }, $('dash'));
</script>
