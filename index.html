  html,body{margin:0;height:100%;overflow:hidden;background:#0d1214;color:#f3e9d2;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(ellipse at 50% 38%,#1b3338 0%,#122126 45%,#0d1214 80%);font-family:"Bungee","Arial Black",Impact,sans-serif}
  .lob{font-family:"Lobster","Brush Script MT",cursive}
  #sky{position:absolute;inset:0;width:100%;height:100%}
  #sky .st{transform-box:fill-box;transform-origin:center;animation:tw 3.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1) rotate(10deg)}}
  header{position:absolute;top:2.2vh;left:0;right:0;text-align:center;pointer-events:none}
  header .n1{font-size:clamp(34px,6.4vh,64px);line-height:1;color:#f3e9d2;text-shadow:3px 3px 0 #10171a}
  header .n2{font-size:clamp(15px,2.8vh,28px);letter-spacing:.08em;color:#e0a526;text-shadow:2px 2px 0 #10171a;margin-top:.1em}
  header .n3{font-size:clamp(8px,1.25vh,12px);letter-spacing:.3em;color:#7cc4bc;margin-top:.5em}
  #floor{position:absolute;left:-50%;right:-50%;bottom:-6vh;height:46vh;transform-origin:50% 0;transform:perspective(600px) rotateX(64deg);
    background:repeating-conic-gradient(#183236 0 25%,#10201f 0 50%) 50% 0/90px 90px;opacity:.9;
    -webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%)}
  #spot{position:absolute;left:50%;top:15vh;width:min(80vw,70vh);height:72vh;transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(ellipse at 50% 92%,rgba(224,165,38,.30),transparent 42%),linear-gradient(to bottom,rgba(243,233,210,.05),rgba(243,233,210,.10));
    clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.9}
  #burst{position:absolute;left:50%;top:calc(17vh + 26vh);width:min(64vh,92vw);height:min(64vh,92vw);transform:translate(-50%,-50%);pointer-events:none;opacity:.15}
  #burst g{transform-origin:0px 0px;transform-box:view-box;animation:spin 40s linear infinite}
  #burst.go g{animation:spin .7s cubic-bezier(.2,.7,.3,1) 1}
  @keyframes spin{to{transform:rotate(360deg)}}
  #stage{position:absolute;left:0;right:0;top:17vh;height:53vh;perspective:1100px}
  .cab{position:absolute;left:50%;bottom:0;height:100%;aspect-ratio:220/420;margin-left:calc(-0.5 * 53vh * 220 / 420);cursor:pointer;
    transform-origin:50% 100%;transition:transform .5s cubic-bezier(.2,.75,.25,1),filter .5s,opacity .5s;
    -webkit-box-reflect:below 1px linear-gradient(transparent 72%,rgba(255,255,255,.16))}
  .cab svg{width:100%;height:100%;display:block;overflow:visible}
  .cab .crt{transform-box:fill-box;transform-origin:center;opacity:0}
  .cab.on .crt{animation:crt .55s ease-out 1}
  @keyframes crt{0%{opacity:1;transform:scale(1,.02)}35%{opacity:1;transform:scale(1,.02)}60%{opacity:.85;transform:scale(1,1)}100%{opacity:0;transform:scale(1,1)}}
  .cab .glow{animation:mq 2.4s ease-in-out infinite}
  @keyframes mq{0%,100%{opacity:.55}50%{opacity:1}}
  .cab.ph .blink{animation:bl 1.2s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .arrow{position:absolute;top:calc(17vh + 20vh);width:min(13vw,72px);height:min(13vw,72px);border:none;background:none;padding:0;cursor:pointer;z-index:50;outline:none}
  .arrow svg{width:100%;height:100%}
  .arrow:focus-visible svg polygon{stroke:#f3e9d2;stroke-width:3}
  #prev{left:1.5vw}#next{right:1.5vw}
  .arrow polygon{fill:#e0a526;filter:drop-shadow(2px 3px 0 #10171a)}
  #prev{animation:nl 1.4s ease-in-out infinite}#next{animation:nr 1.4s ease-in-out infinite}
  @keyframes nl{50%{transform:translateX(-4px)}}@keyframes nr{50%{transform:translateX(4px)}}
  #info{position:absolute;left:0;right:0;top:calc(17vh + 53vh + 2.2vh);text-align:center;padding:0 5vw}
  #tag{display:inline-block;background:#2f8f8a;color:#f3e9d2;font-size:clamp(9px,1.4vh,13px);letter-spacing:.2em;padding:.35em .8em .3em}
  #title{font-size:clamp(18px,3.7vh,36px);color:#e0a526;text-shadow:2px 2px 0 #10171a;margin:.35em 0 .2em;line-height:1.05}
  #blurb{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:clamp(12px,1.8vh,17px);color:#cfe3df;max-width:34em;margin:0 auto;line-height:1.35}
  #play{margin-top:1.6vh;font-family:inherit;font-size:clamp(14px,2.4vh,22px);letter-spacing:.12em;color:#f3e9d2;background:#c8382c;border:none;padding:.5em 1.3em .45em;cursor:pointer;
    box-shadow:4px 4px 0 #10171a;outline:none;animation:pulse 1.3s ease-in-out infinite}
  #play:focus-visible{outline:2px dashed #f3e9d2;outline-offset:3px}
  #play[disabled]{background:#3c4a4f;color:#8a9a9a;animation:none;cursor:default}
  @keyframes pulse{50%{transform:scale(1.05)}}
  #dots{margin-top:1.4vh;display:flex;gap:9px;justify-content:center}
  #dots i{width:9px;height:9px;background:#3c5257;transform:rotate(45deg);display:block}
  #dots i.on{background:#e0a526}
  #hint{position:absolute;bottom:1.4vh;left:0;right:0;text-align:center;font-size:clamp(7px,1.1vh,10px);letter-spacing:.25em;color:#5f7d7a}
  #bug{position:absolute;right:2vw;bottom:2vh;background:#2f8f8a;padding:2px}
  #bug div{background:#f3e9d2;padding:2px 8px 1px;font-size:12px;color:#1f2a30}#bug b{color:#c8382c;font-weight:normal;margin-right:7px}
  #scan{position:absolute;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  @media (max-aspect-ratio:3/4){#stage{top:19vh;height:46vh}.cab{margin-left:calc(-0.5 * 46vh * 220 / 420)}#info{top:calc(19vh + 46vh + 3vh)}#burst{top:calc(19vh + 23vh)}#hint{display:none}.arrow{top:calc(19vh + 17vh)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1 class="sr">Forrester Funtainment arcade: pick a game</h1>
<svg id="sky" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
<div id="spot"></div>
<div id="floor"></div>
<svg id="burst" viewBox="-100 -100 200 200" aria-hidden="true"><g id="burstg"></g></svg>
<header><div class="n1 lob">Forrester</div><div class="n2">FUNTAINMENT</div><div class="n3">LUCKY CEVIN’S ARCADE  •  FREE PLAY</div></header>
<div id="stage" role="listbox" aria-label="Game cabinets"></div>
<button class="arrow" id="prev" aria-label="Previous cabinet"><svg viewBox="0 0 40 40"><polygon points="28,6 8,20 28,34"/></svg></button>
<button class="arrow" id="next" aria-label="Next cabinet"><svg viewBox="0 0 40 40"><polygon points="12,6 32,20 12,34"/></svg></button>
<div id="info" aria-live="polite"><span id="tag"></span><div id="title"></div><div id="blurb"></div><button id="play">PLAY ▶</button><div id="dots"></div></div>
<div id="hint">◀ ▶ TO BROWSE  •  ENTER TO PLAY</div>
<div id="bug"><div><b>7</b>KDCF</div></div>
<div id="scan"></div>
<script>
"use strict";
// ---------- the lineup: add a game by adding an entry (href is its folder); entries with no href are gray placeholders ----------
const GAMES=[
  {id:'turkey',href:'turkey/',tag:'THANKSGIVING 2026',title:'THE GREAT TURKEY ESCAPE',blurb:'Bust out of the oven, dodge the traffic, cross the gravy and get pardoned.',
   body:'#d9622b',side:'#8a3a18',trim:'#e0a526',mq:'#e0a526',mqText:'#c8382c',mq1:'The Great',mq2:'TURKEY ESCAPE',screen:'turkey'},
  {id:'humbugs',href:'humbugs/',tag:'CHRISTMAS 2026',title:'RUDOLPH VS. THE HUMBUGS',blurb:'A remake of Darci’s 1998 Christmas card game. Drop the presents, zap the humbugs, save Christmas.',
   body:'#2f8f8a',side:'#1d5f5c',trim:'#c8382c',mq:'#c8382c',mqText:'#f3e9d2',mq1:'Rudolph vs. the',mq2:'HUMBUGS',screen:'humbugs'},
  {id:'soon1'},{id:'soon2'},{id:'soon3'}];
const SOON={tag:'NEXT HOLIDAY',title:'COMING SOON',blurb:'Another Forrester Funtainment card is in the works.'};
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const C={cream:'#f3e9d2',must:'#e0a526',teal:'#2f8f8a',tealLt:'#7cc4bc',orange:'#d9622b',red:'#c8382c',char:'#1f2a30',ink:'#10171a'};
function sputnik(x,y,R,col,cls){let s='<g'+(cls?' class="'+cls+'"':'')+'>';for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?R*.62:R,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
  s+=`<line x1="${x}" y1="${y}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="${col}" stroke-width="${Math.max(.8,R*.07).toFixed(2)}" stroke-linecap="round"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(R*(i%2?.07:.1)).toFixed(2)}" fill="${col}"/>`}
  return s+`<circle cx="${x}" cy="${y}" r="${(R*.12).toFixed(2)}" fill="${col}"/></g>`}

// ---------- sky and the big starburst ----------
{let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;let s='';const cols=[C.must,C.tealLt,C.orange,C.cream];
  for(let i=0;i<26;i++){const x=rnd()*1000,y=rnd()*560,r=4+rnd()*10;s+=sputnik(Math.round(x),Math.round(y),r,cols[i%4],'st').replace('<g class="st"',`<g class="st" style="animation-delay:${(-rnd()*3.6).toFixed(2)}s"`)}
  $('sky').innerHTML=s;$('burstg').innerHTML=sputnik(0,0,96,C.must)}

// ---------- the attract screens, drawn into a 112x120 screen ----------
const SCREENS={
  turkey:()=>`<rect width="112" height="120" fill="#3f7a35"/><rect y="0" width="112" height="16" fill="#5a9a46"/>
    ${[22,30,38].map(y=>`<rect y="${y-4}" width="112" height="8" fill="#8a5a2b"/>`).join('')}
    <g><animateTransform attributeName="transform" type="translate" from="-40 0" to="112 0" dur="5s" repeatCount="indefinite"/><ellipse cx="10" cy="22" rx="9" ry="3" fill="#f3d9a0"/><ellipse cx="40" cy="30" rx="7" ry="3" fill="#f3d9a0"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="112 0" to="-40 0" dur="4s" repeatCount="indefinite"/><ellipse cx="10" cy="38" rx="8" ry="3" fill="#f3d9a0"/></g>
    <rect y="48" width="112" height="52" fill="#3a4448"/>${[61,74,87].map(y=>`<line x1="0" y1="${y}" x2="112" y2="${y}" stroke="#e0a526" stroke-width="1" stroke-dasharray="6 6"/>`).join('')}
    <g><animateTransform attributeName="transform" type="translate" from="-30 0" to="120 0" dur="2.6s" repeatCount="indefinite"/><rect x="0" y="51" width="20" height="8" fill="#c8382c"/><rect x="13" y="52" width="5" height="6" fill="#7cc4bc"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="120 0" to="-30 0" dur="3.4s" repeatCount="indefinite"/><rect x="0" y="64" width="24" height="8" fill="#e0a526"/><rect x="2" y="65" width="5" height="6" fill="#7cc4bc"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-30 0" to="120 0" dur="2s" repeatCount="indefinite"/><rect x="0" y="77" width="18" height="8" fill="#f3e9d2"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="120 0" to="-30 0" dur="3s" repeatCount="indefinite"/><rect x="0" y="90" width="28" height="8" fill="#2f8f8a"/></g>
    <rect y="100" width="112" height="20" fill="#5a9a46"/>
    <g><animateTransform attributeName="transform" type="translate" values="56 110;56 110;56 97;56 97;56 84;56 84;56 110" keyTimes="0;.2;.28;.48;.56;.8;1" dur="3s" repeatCount="indefinite"/>
      <circle r="5" fill="#8a5a2b"/><circle cx="3" cy="-5" r="2.6" fill="#a8743f"/><circle cx="5" cy="-3.5" r="1.1" fill="#c8382c"/></g>`,
  humbugs:()=>`<rect width="112" height="120" fill="#1b3350"/>${[[10,12],[30,30],[70,8],[95,26],[50,20],[84,44],[20,52]].map(([x,y])=>`<rect x="${x}" y="${y}" width="1.5" height="1.5" fill="#f3e9d2"/>`).join('')}
    <circle cx="92" cy="16" r="8" fill="#f3e9d2" opacity=".85"/>
    <path d="M0,104 Q28,92 56,102 T112,98 L112,120 L0,120Z" fill="#e9e2cf"/>
    <g fill="#10171a"><rect x="14" y="90" width="14" height="12"/><polygon points="12,91 21,83 30,91"/><rect x="78" y="88" width="16" height="14"/><polygon points="76,89 86,80 96,89"/></g>
    <rect x="18" y="94" width="3" height="3" fill="#e0a526"/><rect x="83" y="92" width="3" height="3" fill="#e0a526"/>
    <g><animateMotion dur="4s" repeatCount="indefinite" path="M-10,40 C30,20 60,60 120,36"/><ellipse rx="7" ry="2.6" fill="#2f8f8a"/><circle cy="-2.4" r="3.4" fill="#7cc04a"/></g>
    <g><animateMotion dur="5s" repeatCount="indefinite" path="M120,60 C80,80 40,44 -10,64"/><ellipse rx="7" ry="2.6" fill="#2f8f8a"/><circle cy="-2.4" r="3.4" fill="#7cc04a"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="10 70;30 66;20 72;10 70" dur="3s" repeatCount="indefinite"/>
      <path d="M-6,0 L10,0 Q12,0 12,-3 L12,-6" stroke="#2f8f8a" stroke-width="2.4" fill="none"/><rect x="-6" y="-6" width="12" height="5" fill="#2f8f8a"/><circle cx="2" cy="-8" r="2.4" fill="#c8382c"/>
      <line x1="12" y1="-4" x2="20" y2="-4" stroke="#8a5a2b" stroke-width="1"/><ellipse cx="24" cy="-4" rx="4" ry="2.2" fill="#a8743f"/><circle cx="28.5" cy="-5" r="1.6" fill="#ff4a3a"/>
      <line x1="31" y1="-5" x2="60" y2="-5" stroke="#c8382c" stroke-width="1.2"><animate attributeName="opacity" values="0;0;1;0" dur=".8s" repeatCount="indefinite"/></line></g>`,
  soon:()=>`<rect width="112" height="120" fill="#2c3538"/>${Array.from({length:30},(_,i)=>`<rect x="${(i*37)%108}" y="${(i*53)%116}" width="${2+i%3}" height="1" fill="#6c7a7c" opacity=".6"/>`).join('')}
    <rect width="112" height="14" fill="#5b6a6d" opacity=".35"><animateTransform attributeName="transform" type="translate" from="0 -14" to="0 120" dur="2.4s" repeatCount="indefinite"/></rect>
    <text class="blink" x="56" y="58" text-anchor="middle" font-family="Bungee,Arial Black,sans-serif" font-size="11" fill="#a7b4b4">COMING</text>
    <text class="blink" x="56" y="73" text-anchor="middle" font-family="Bungee,Arial Black,sans-serif" font-size="11" fill="#a7b4b4">SOON</text>`};

// ---------- one cabinet shape, every game wears it ----------
function cabSVG(g,i){const ph=!g.href,body=ph?'#4a5559':g.body,side=ph?'#2e3739':g.side,trim=ph?'#6c7a7c':g.trim,mq=ph?'#5b6a6d':g.mq,mqT=ph?'#c9d1cf':g.mqText;
  const id='c'+i;
  return `<svg viewBox="0 0 220 420" aria-hidden="true">
  <defs><clipPath id="${id}s"><rect x="44" y="98" width="112" height="120" rx="10"/></clipPath>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <ellipse cx="110" cy="414" rx="104" ry="7" fill="#000" opacity=".45"/>
  <polygon points="180,16 206,30 206,410 180,410" fill="${side}"/><polygon points="180,16 206,30 206,36 180,22" fill="${trim}" opacity=".7"/>
  <polygon points="186,244 210,256 206,286 180,282" fill="${side}" opacity=".85"/>
  <rect x="18" y="16" width="164" height="68" rx="6" fill="${body}" stroke="${trim}" stroke-width="3"/>
  <rect x="26" y="24" width="148" height="52" rx="3" fill="${mq}"/><rect class="glow" x="26" y="24" width="148" height="52" rx="3" fill="url(#${id}g)"/>
  ${ph?`<text x="100" y="58" text-anchor="middle" font-family="Bungee,Arial Black,sans-serif" font-size="16" fill="${mqT}">COMING SOON</text>`
     :`<text x="100" y="44" text-anchor="middle" font-family="Lobster,cursive" font-size="15" fill="${C.ink}">${g.mq1}</text>
       <text x="100" y="68" text-anchor="middle" font-family="Bungee,Arial Black,sans-serif" font-size="${g.mq2.length>9?16:23}" fill="${mqT}" stroke="${C.ink}" stroke-width=".6">${g.mq2}</text>`}
  <rect x="24" y="84" width="152" height="160" fill="${body}" stroke="${trim}" stroke-width="3"/>
  <rect x="34" y="90" width="132" height="146" rx="8" fill="${C.ink}"/>
  <g clip-path="url(#${id}s)"><g transform="translate(44,98)">${SCREENS[ph?'soon':g.screen]()}</g>
    <rect x="44" y="98" width="112" height="120" fill="url(#${id}g)" opacity=".35"/>
    <rect class="crt" x="44" y="98" width="112" height="120" fill="#f3e9d2"/></g>
  <polygon points="12,244 188,244 178,264 22,264" fill="${body}" stroke="${trim}" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="16,247 184,247 182,251 18,251" fill="#fff" opacity=".18"/>
  <rect x="22" y="264" width="156" height="20" fill="${side}"/>
  <line x1="62" y1="254" x2="58" y2="242" stroke="${C.ink}" stroke-width="3"/><circle cx="57" cy="240" r="6" fill="${ph?'#7d8a8b':C.red}" stroke="${C.ink}" stroke-width="1.5"/>
  ${[[112,256],[132,252],[152,256]].map(([x,y],k)=>`<ellipse cx="${x}" cy="${y}" rx="7" ry="4" fill="${ph?'#7d8a8b':[C.must,C.cream,C.tealLt][k]}" stroke="${C.ink}" stroke-width="1.5"/>`).join('')}
  <rect x="26" y="284" width="148" height="110" fill="${body}" stroke="${trim}" stroke-width="3"/>
  ${ph?'':sputnik(56,318,20,trim)}
  <rect x="84" y="300" width="56" height="58" rx="3" fill="${C.char}" stroke="${C.ink}" stroke-width="2"/>
  <rect x="94" y="310" width="12" height="16" fill="${ph?'#3c4a4f':C.orange}"/><rect x="118" y="310" width="12" height="16" fill="${ph?'#3c4a4f':C.orange}"/>
  <rect x="98" y="314" width="4" height="8" fill="${C.ink}"/><rect x="122" y="314" width="4" height="8" fill="${C.ink}"/>
  <text x="112" y="345" text-anchor="middle" font-family="Bungee,Arial Black,sans-serif" font-size="7" fill="${ph?'#6c7a7c':C.must}">FREE PLAY</text>
  <rect x="26" y="394" width="148" height="16" fill="${C.ink}"/><rect x="26" y="394" width="148" height="2" fill="${trim}" opacity=".6"/>
  </svg>`}

// ---------- the carousel ----------
const stage=$('stage'),N=GAMES.length,cabs=GAMES.map((g,i)=>{const d=document.createElement('div');d.className='cab'+(g.href?'':' ph');d.innerHTML=cabSVG(g,i);
  d.setAttribute('role','option');d.setAttribute('aria-label',g.href?g.title:SOON.title);d.addEventListener('click',()=>{wake();if(i===sel)go();else pick(i,true)});stage.appendChild(d);return d});
GAMES.forEach(()=>$('dots').appendChild(document.createElement('i')));
let sel=(()=>{try{const v=localStorage.getItem('ff_cab');const i=GAMES.findIndex(g=>g.id===v);if(i>=0)return i}catch(e){}
  const d=new Date(),m=d.getMonth(),day=d.getDate();return (m===10&&day<=28)||m<10&&m>7?0:1})();
function wrapD(i){let d=i-sel;if(d>N/2)d-=N;if(d<-N/2)d+=N;return d}
function layout(){const h=stage.clientHeight,w=innerWidth,cw=h*220/420,sp=Math.min(w*0.34,cw*1.02);
  cabs.forEach((c,i)=>{const d=wrapD(i),a=Math.abs(d),sc=a===0?1:a===1?.66:.46,tx=Math.sign(d)*(a===0?0:a===1?sp:sp*1.62);
    c.style.transform=`translateX(${tx}px) rotateY(${-d*26}deg) scale(${sc})`;c.style.zIndex=10-a;
    c.style.filter=a===0?'none':`brightness(${a===1?.55:.35}) saturate(.8)`;c.style.opacity=a>2?0:1;c.setAttribute('aria-selected',a===0)});
  const g=GAMES[sel],ph=!g.href;$('tag').textContent=ph?SOON.tag:g.tag;$('title').textContent=ph?SOON.title:g.title;$('blurb').textContent=ph?SOON.blurb:g.blurb;
  $('tag').style.background=ph?'#3c4a4f':C.teal;const b=$('play');b.disabled=ph;b.textContent=ph?'NOT YET':'PLAY ▶';
  [...$('dots').children].forEach((d,i)=>d.className=i===sel?'on':'')}
function pick(i,sound){sel=(i+N)%N;layout();const c=cabs[sel];c.classList.remove('on');void c.offsetWidth;c.classList.add('on');
  const bu=$('burst');bu.classList.remove('go');void bu.offsetWidth;bu.classList.add('go');
  if(sound){beep(GAMES[sel].href?660:330,.07,'square',.035);setTimeout(()=>beep(GAMES[sel].href?990:250,.09,'square',.03),70)}
  try{localStorage.setItem('ff_cab',GAMES[sel].id)}catch(e){}}
function go(){const g=GAMES[sel];if(!g.href){beep(140,.18,'sawtooth',.04,-60);return}
  beep(523,.08,'square',.04);setTimeout(()=>beep(784,.08,'square',.04),80);setTimeout(()=>beep(1047,.16,'square',.04),160);
  const c=cabs[sel];c.classList.remove('on');void c.offsetWidth;c.classList.add('on');setTimeout(()=>location.href=g.href,420)}
$('burst').addEventListener('animationend',()=>$('burst').classList.remove('go'));
$('prev').onclick=()=>{wake();pick(sel-1,true)};$('next').onclick=()=>{wake();pick(sel+1,true)};$('play').onclick=()=>{wake();go()};
addEventListener('keydown',e=>{wake();if(['ArrowLeft','KeyA'].includes(e.code)){e.preventDefault();pick(sel-1,true)}else if(['ArrowRight','KeyD'].includes(e.code)){e.preventDefault();pick(sel+1,true)}
  else if(e.code==='Enter'||e.code==='Space'){if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&document.activeElement.id!=='play')return;e.preventDefault();go()}});
{let x0=null,y0=0;stage.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  stage.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){wake();pick(sel+(dx<0?1:-1),true)}},{passive:true})}
addEventListener('resize',layout);

// ---------- tiny blips, only after a poke ----------
let ac=null;
function wake(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
function beep(f,d,type,v,slide){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v||.04,t);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}

document.fonts&&document.fonts.ready.then(layout);pick(sel,false);
</script>
</body>
</html>
